name: Publish to BCR

on:
  workflow_call:
    inputs:
      release_artifacts_run_id:
        description: "Release workflow run containing the attested archive"
        required: false
        type: string
      tag_name:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_artifacts_run_id:
        description: "Original Release workflow run ID; recommended for manual retries"
        required: false
        type: string
      tag_name:
        description: "Release tag to publish, for example v0.3.0"
        required: true
        type: string

jobs:
  publish:
    # BCR provenance verification recognizes this community trusted builder by
    # its semantic version ref; do not replace the ref with a commit SHA.
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      attest: true
      draft: true
      release_artifacts_run_id: ${{ inputs.release_artifacts_run_id || github.run_id }}
      tag_name: ${{ inputs.tag_name }}
      registry_fork: TraceMachina/bazel-central-registry
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

  finalize:
    name: Publish attested GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag_name }}
          make_latest: true
